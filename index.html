<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bills+</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e1e1e">

  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div>
    <h1>💸 Bills+</h1>
    <p class="tagline">Track • Pay • Stay Ahead</p>
  </div>
  <button class="icon-btn" onclick="toggleDark()">🌙</button>
</header>

<nav>
  <button onclick="showTab('admin')">Admin</button>
  <button onclick="showTab('bills')">Bills</button>
  <button onclick="showTab('history')">History</button>
</nav>

<!-- ADMIN -->
<section id="admin" class="tab">
  <h2>Add Bill</h2>

  <input id="billName" placeholder="Bill name">
  <input id="billAmount" type="number" placeholder="Amount">
  <input id="billDue" type="date">
  <input id="billIcon" placeholder="Emoji icon (💡)">

  <button class="primary" onclick="addBill()">Save Bill</button>

  <h3>Manage Bills</h3>
  <ul id="adminList"></ul>
</section>

<!-- BILLS -->
<section id="bills" class="tab hidden">
  <div id="monthTabs" class="month-tabs"></div>
  <div class="summary" id="summary"></div>
  <div id="billsContainer"></div>
</section>

<!-- HISTORY -->
<section id="history" class="tab hidden">
  <h2>Payment History</h2>
  <button class="danger" onclick="clearHistory()">Clear History</button>

  <ul id="historyList"></ul>
</section>

<footer>
  <small>Bills+ v1.1 • Offline Ready</small>
</footer>

<script src="app.js"></script>
</body>
</html>
